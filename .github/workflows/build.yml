name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Dependencies
        run: |
          go get github.com/getlantern/systray
          go get golang.org/x/sys/windows
          go get golang.org/x/sys/windows/registry
          go get gopkg.in/toast.v1
          go install github.com/akavel/rsrc@latest
          go mod tidy

      - name: Generate and Embed Native Icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Transparent)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(255, 46, 189, 89)), 2
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 30, 30, 30))
          $g.FillEllipse($brush, 6, 4, 20, 24)
          $g.DrawEllipse($pen, 6, 4, 20, 24)
          $wheelPen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(255, 255, 255, 255)), 2
          $g.DrawLine($wheelPen, 16, 7, 16, 12)
          $g.Dispose()
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = New-Object System.IO.FileStream ("app.ico", [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $bmp.Dispose()
          rsrc -ico app.ico -o rsrc.syso

      - name: Build Windows Binary
        run: |
          go build -ldflags="-H windowsgui -s -w" -o DareuAE6V2Tray.exe .

      - name: Generate Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "达尔优 AE6 V2 托盘助手 ${{ steps.tag.outputs.release_tag }}"
          body: |
            ### 达尔优 AE6 V2 电量监控小工具
            - 彻底剔除 karalabe/hid C 依赖，改用纯 Win32 API 原生驱动，彻底杜绝闪退。
            - 针对 16 字节短报文与 100% 满电精确匹配[cite: 15, 20]。
          files: DareuAE6V2Tray.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Dependencies
        run: |
          go get github.com/getlantern/systray
          go get github.com/karalabe/hid
          go get golang.org/x/sys/windows
          go get golang.org/x/sys/windows/registry
          go get gopkg.in/toast.v1
          go install github.com/akavel/rsrc@latest
          go mod tidy

      # 下载精美游戏鼠标图标并嵌入 EXE 文件头
      - name: Embed Custom App Icon
        shell: bash
        run: |
          curl -sL -o app.ico https://raw.githubusercontent.com/runelite/runelite/master/runelite-client/src/main/resources/net/runelite/client/ui/runelite.ico || true
          if [ -f app.ico ]; then
            rsrc -ico app.ico -o rsrc.syso
          fi

      - name: Build Windows Binary
        run: |
          go build -ldflags="-H windowsgui -s -w" -o DareuAE6V2Tray.exe .

      - name: Generate Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "达尔优 AE6 V2 托盘助手 ${{ steps.tag.outputs.release_tag }}"
          body: |
            ### 达尔优 AE6 V2 电量监控小工具
            - 嵌入原生精美图标[cite: 23]。
            - 增强达尔优全系 PID 与心跳探测协议[cite: 4, 6]。
            - 新增右键诊断排查日志功能。
          files: DareuAE6V2Tray.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

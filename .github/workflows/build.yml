name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Dependencies
        run: |
          go get github.com/getlantern/systray
          go get github.com/karalabe/hid
          go get golang.org/x/sys/windows/registry
          go get gopkg.in/toast.v1
          go install github.com/tc-hib/go-winres@latest
          go mod tidy

      # 生成精美的 Windows EXE 图标资源
      - name: Generate Windows Icon Resource
        run: |
          go-winres simply --icon https://raw.githubusercontent.com/feathericons/feather/master/icons/mouse-pointer.png || true

      - name: Build Windows Binary
        run: |
          go build -ldflags="-H windowsgui -s -w" -o DareuAE6V2Tray.exe .

      - name: Generate Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "达尔优 AE6 V2 托盘助手 ${{ steps.tag.outputs.release_tag }}"
          body: |
            ### 达尔优 AE6 V2 电量监控小工具
            - 嵌入原生桌面图标，告别白框默认文件[cite: 23]。
            - 增强 HID 通信侦测能力，优化充电与电量识别。
          files: DareuAE6V2Tray.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Generate Native Icon
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 32, 32
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Transparent)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(255, 46, 189, 89)), 2
          $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255, 30, 30, 30))
          $g.FillEllipse($brush, 6, 4, 20, 24)
          $g.DrawEllipse($pen, 6, 4, 20, 24)
          $wheelPen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(255, 255, 255, 255)), 2
          $g.DrawLine($wheelPen, 16, 7, 16, 12)
          $g.Dispose()
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $fs = New-Object System.IO.FileStream ("app.ico", [System.IO.FileMode]::Create)
          $icon.Save($fs)
          $fs.Close()
          $bmp.Dispose()

      - name: Build Windows Binary
        shell: powershell
        run: |
          $entry = "my_devices.py"
          if (-not (Test-Path $entry)) {
            if (Test-Path "main.go") {
              $entry = "main.go"
            } else {
              $pyFiles = Get-ChildItem -Filter "*.py" -File
              if ($pyFiles.Count -gt 0) {
                $entry = $pyFiles[0].Name
              } else {
                Write-Error "No Python entry file found"
                exit 1
              }
            }
          }
          Write-Host "Entry file: $entry"
          pyinstaller --noconfirm --onefile --windowed --name "DareuAE6V2Tray" --icon "app.ico" $entry

      - name: Verify Build Output
        shell: powershell
        run: |
          $exe = "dist\DareuAE6V2Tray.exe"
          if (Test-Path $exe) {
            $size = (Get-Item $exe).Length
            Write-Host "Build OK: $exe ($size bytes)"
          } else {
            Write-Error "Build failed: $exe not found"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DareuAE6V2Tray-windows
          path: dist/DareuAE6V2Tray.exe

      - name: Generate Release Tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "达尔优 AE6 V2 托盘助手 ${{ steps.tag.outputs.release_tag }}"
          body: |
            ### 达尔优 AE6 V2 电量监控小工具
            - 纯 Python + ctypes + tkinter，零第三方运行时依赖
            - 支持 达尔优 AE6 V2 鼠标 + Xbox 360 手柄 双设备电量监控
            - 修复了函数名不匹配导致鼠标永远无法读取的 bug
            - 补全了 XInput / GDI 函数的 64 位类型安全声明
          files: dist/DareuAE6V2Tray.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
